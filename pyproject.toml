[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "self-harness-reproduction"
version = "0.1.0"
description = "Auditable mechanism reproduction for Self-Harness"
readme = "README_REPRODUCTION.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]
harness = [
  "deepagents==0.6.12",
  "langchain>=1.3.11,<2",
  "langchain-openai>=1.1,<2",
]
harbor = ["harbor==0.20.0"]

[project.scripts]
self-harness-reproduce = "self_harness_workflow.cli:main"

[tool.hatch.build.targets.wheel]
packages = [
  "workflow/src/self_harness_workflow",
  "acceptance/src/self_harness_acceptance",
  "diagnosis/src/self_harness_diagnosis",
  "proposer/src/self_harness_proposer",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
