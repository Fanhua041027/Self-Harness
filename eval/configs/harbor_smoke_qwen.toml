[eval]
name = "tb2-clean64-smoke"
runner = "harbor_cli"
model = "${SELF_HARNESS_MODEL}"
repeats = 1
evals_project = "../.."
harness_workspace = "../harness_workspace"
task_root = "${SELF_HARNESS_TB2_ROOT}"
agent_import_path = "self_harness_harbor.harbor_wrapper:FixedHarnessWrapper"
environment = "docker"
agent_kwargs = ["hard_timeout_sec=600"]
case_concurrency = 1
timeout_s = 900
infrastructure_retries = 1

[[cases]]
case_id = "bn-fit-modify"
split = "train"
stratum = "clean64"

[[cases]]
case_id = "build-cython-ext"
split = "train"
stratum = "clean64"
