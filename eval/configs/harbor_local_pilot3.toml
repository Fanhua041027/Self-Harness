[eval]
name = "tb2-pilot3"
runner = "harbor_cli"
model = "${SELF_HARNESS_MODEL}"
repeats = 1
evals_project = "../.."
harness_workspace = "../harness_workspace"
task_root = "${SELF_HARNESS_TB2_ROOT}"
agent_import_path = "self_harness_harbor.harbor_wrapper:FixedHarnessWrapper"
environment = "docker"
agent_kwargs = ["hard_timeout_sec=600"]
case_concurrency = 2
timeout_s = 900
infrastructure_retries = 2

[[cases]]
case_id = "log-summary-date-ranges"
split = "train"
stratum = "pilot3"

[[cases]]
case_id = "fix-git"
split = "train"
stratum = "pilot3"

[[cases]]
case_id = "break-filter-js-from-html"
split = "heldout"
stratum = "pilot3"
