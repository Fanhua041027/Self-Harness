[eval]
name = "tb2-clean64-deepseek-smoke"
runner = "harbor_cli"
model = "${SELF_HARNESS_MODEL}"
repeats = 1
evals_project = "../.."
harness_workspace = "../harness_workspace"
task_root = "${SELF_HARNESS_TB2_ROOT}"
agent_import_path = "self_harness_harbor.harbor_wrapper:FixedHarnessWrapper"
environment = "docker"
agent_kwargs = ["hard_timeout_sec=900"]
case_concurrency = 1
timeout_s = 1800
infrastructure_retries = 0

[[cases]]
case_id = "fix-git"
split = "train"
stratum = "clean64"

[[cases]]
case_id = "log-summary-date-ranges"
split = "train"
stratum = "clean64"

[[cases]]
case_id = "kv-store-grpc"
split = "heldout"
stratum = "clean64"

[[cases]]
case_id = "openssl-selfsigned-cert"
split = "heldout"
stratum = "clean64"
