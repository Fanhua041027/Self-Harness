[eval]
name = "tb2-clean64-probe-gcode"
runner = "harbor_cli"
model = "${SELF_HARNESS_MODEL}"
repeats = 1
evals_project = "../.."
harness_workspace = "../harness_workspace"
task_root = "${SELF_HARNESS_TB2_ROOT}"
agent_import_path = "self_harness_harbor.harbor_wrapper:FixedHarnessWrapper"
environment = "docker"
agent_kwargs = ["hard_timeout_sec=5400"]
case_concurrency = 1
timeout_s = 5400
infrastructure_retries = 0
agent_timeout_multiplier = 4.0

[[cases]]
case_id = "gcode-to-text"
split = "train"
stratum = "clean64"
